services:
  trustcalc:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TRUSTCALC_ENV: development
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "python scripts/local_ai_smoke_test.py && python benchmarks/generate_professional_review_figures.py"
